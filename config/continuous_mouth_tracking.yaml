continuous_mouth_tracking:
  initial_target_acquisition_timeout_sec: 3.0
  target_timeout_sec: 0.30
  # Exact image-time TF can trail the RGB-D stream by roughly 0.5 s under the
  # measured real controller/camera load. Raw frames are retained only for
  # this bounded transform catch-up; they are never queued as motion commands.
  image_time_tf_catchup_timeout_sec: 0.75
  image_time_tf_pending_frame_limit: 12
  # Hold zero velocity through brief full-target loss, then abort.
  lost_target_timeout_sec: 1.00
  # MediaPipe can briefly report no_face when the wrist camera reaches a
  # close-up view. Keep the robot stationary while allowing a small backward
  # head movement to restore a fresh target; never move from the retained pose.
  close_range_face_dropout_depth_m: 0.200
  close_range_face_reacquisition_timeout_sec: 3.00
  # A visible face with a temporarily invalid depth gets a longer stationary
  # reacquisition window. No RGB-only motion is permitted during this time.
  depth_reacquisition_timeout_sec: 2.00
  # The real camera routinely operates closer than 150 mm. Accept finite
  # close-range samples while retaining a nonzero sensor-sanity floor.
  minimum_depth_m: 0.050
  maximum_depth_m: 1.30
  minimum_confidence: 0.60
  stable_sample_count: 3
  stable_max_spread_m: 0.025
  prediction_horizon_sec: 0.10
  maximum_prediction_m: 0.020
  # Continuous tracking offsets the straw target 50 mm along tool0 local +Y;
  # the live tool orientation rotates this vector into base_link.
  final_pre_mouth_standoff_m: 0.050
  pre_mouth_approach_axis_tool0: [0.0, 1.0, 0.0]
  coarse_staging_standoff_m: 0.250
  provisional_standoff_m: 0.250
  hold_entry_tolerance_m: 0.010
  # A close-range detector bias and collision-proximity scaling may leave the
  # physical straw farther from the tracked mouth than the nominal 50 mm
  # target. This fallback remains farther-only and requires a continuous
  # confirmation dwell. The reviewed bounds cover the terminal geometry from
  # the 2026-08-17 10:42 and 10:49 real runs without changing the 50 mm
  # minimum standoff or any motion/collision guard.
  conservative_hold_commanded_standoff_max_m: 0.180
  conservative_hold_actual_standoff_max_m: 0.220
  conservative_hold_outward_error_max_m: 0.070
  conservative_hold_transverse_tolerance_m: 0.020
  conservative_hold_confirmation_sec: 0.50
  hold_duration_sec: 5.0

  servo_tracking_max_error_m: 0.10
  servo_replan_enter_m: 0.10
  servo_replan_exit_m: 0.06
  maximum_standoff_rate_mps: 0.010
  standoff_progress_error_m: 0.030
  standoff_final_tolerance_m: 0.001
  # The measured staging-to-hold approach can need more than 45 s when MoveIt
  # Servo's collision-proximity scaling is active. Keep a bounded 60 s session;
  # all per-cycle collision, freshness, workspace, and robot-state gates remain
  # authoritative throughout it.
  maximum_tracking_duration_sec: 60.0
  state_validity_check_period_sec: 0.10
  # Match the active MoveIt Servo publish period (0.004 s). Perception may
  # update more slowly; the controller always reuses only its newest target.
  control_rate_hz: 250.0
  maximum_linear_speed_mps: 0.020
  # Do not switch Cartesian speed when the short RGB-D history changes between
  # provisional and stable; acceleration limiting remains active.
  provisional_linear_speed_mps: 0.020
  maximum_linear_acceleration_mps2: 0.10
  maximum_angular_speed_rps: 0.15
  orientation_correction_gain: 1.0
  # The last three real tracked runs delivered accepted mouth coordinates at
  # 8.26-10.83 Hz. At the unchanged 20 mm/s Servo cap, the tool can move only
  # 1.85-2.42 mm between accepted coordinates. A 1.2 /s proportional gain
  # reaches that cap at 16.7 mm error, improving small-motion responsiveness
  # without changing collision scaling, acceleration, or maximum speed.
  control_gain: 1.2
  maximum_tool_radius_m: 1.30
  maximum_flange_tilt_deg: 5.0

  use_octomap: false
  servo_twist_topic: /servo_node/delta_twist_cmds
  servo_status_topic: /servo_node/status
  servo_command_frame: base_link
  servo_ee_frame: tool0
