# Project-local Gazebo controller settings for the elevated UR10e feeding scene.
# The simulated arm transiently exceeds the upstream 0.20 rad path tolerance
# during otherwise valid, slow MoveIt trajectories. A 1.0 rad path tolerance
# prevents this simulator artifact while final joint-goal checks remain active.
controller_manager:
  ros__parameters:
    update_rate: 500
    # Required explicitly by the installed Jazzy gz_ros2_control plugin. It
    # converts position error into a bounded joint-velocity command; upstream
    # uses 0.1 as its default.
    position_proportional_gain: 0.1
    hold_joints: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    io_and_status_controller:
      type: ur_controllers/GPIOController
    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController
    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    forward_position_controller:
      type: position_controllers/JointGroupPositionController

speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0

joint_trajectory_controller:
  ros__parameters:
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 1.0, goal: 0.20 }
      shoulder_lift_joint: { trajectory: 1.0, goal: 0.20 }
      elbow_joint: { trajectory: 1.0, goal: 0.20 }
      wrist_1_joint: { trajectory: 1.0, goal: 0.20 }
      wrist_2_joint: { trajectory: 1.0, goal: 0.20 }
      wrist_3_joint: { trajectory: 1.0, goal: 0.20 }

scaled_joint_trajectory_controller:
  ros__parameters:
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    speed_scaling_interface_name: ""
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 1.0, goal: 0.20 }
      shoulder_lift_joint: { trajectory: 1.0, goal: 0.20 }
      elbow_joint: { trajectory: 1.0, goal: 0.20 }
      wrist_1_joint: { trajectory: 1.0, goal: 0.20 }
      wrist_2_joint: { trajectory: 1.0, goal: 0.20 }
      wrist_3_joint: { trajectory: 1.0, goal: 0.20 }

forward_velocity_controller:
  ros__parameters:
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    interface_name: velocity

forward_position_controller:
  ros__parameters:
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    interface_name: position
